spring:
  application:
    name: car-rental-api
  datasource:
    # Valores padrão servem apenas para o banco local do docker-compose.
    # Em qualquer outro ambiente, defina DB_URL, DB_USER e DB_PASSWORD.
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/car_rental}
    username: ${DB_USER:car_rental}
    password: ${DB_PASSWORD:car_rental}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
